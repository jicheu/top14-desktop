name: top14-live
base: core24
version: '1.0.0'
title: Top 14 Live
summary: Top 14 Rugby live score tracker
description: |
  Follow Top 14 rugby matches in real time.
  Live scores, standings, and a tray icon for quick access from the system tray.
  The embedded backend polls live data automatically — no configuration needed.
grade: stable
confinement: strict

icon: assets/icon.png

apps:
  top14-live:
    command: bin/top14-live
    desktop: usr/share/applications/top14-live.desktop
    extensions: [gnome]
    plugs:
      - network
      - network-bind
      - home
      - audio-playback
      - browser-support
    environment:
      NO_AT_BRIDGE: '1'

parts:
  top14-live:
    plugin: nil
    source: .
    build-snaps:
      - node/20/stable
    override-build: |
      # Install root dependencies (electron-builder and Electron itself)
      npm ci

      # Install backend dependencies so electron-builder's extraResources
      # includes backend/node_modules in the packaged app.
      (cd backend && npm ci --omit=dev)

      # frontend-dist must be pre-built before running snapcraft.
      # See SNAP_PACKAGING.md for instructions.

      # Build for the current system architecture; electron-builder auto-detects it
      npx electron-builder --linux dir

      # Locate the unpacked output directory (name varies by arch)
      UNPACKED=$(ls -d dist/linux*unpacked 2>/dev/null | head -1)
      if [ -z "$UNPACKED" ]; then
        echo "ERROR: electron-builder unpacked output not found in dist/" >&2
        exit 1
      fi

      mkdir -p "$CRAFT_PART_INSTALL/opt/top14-live"
      cp -r "$UNPACKED"/. "$CRAFT_PART_INSTALL/opt/top14-live/"

      # electron-builder names the binary after package.json "name" (top14-desktop);
      # rename it to match the snap app command path.
      if [ -f "$CRAFT_PART_INSTALL/opt/top14-live/top14-desktop" ]; then
        mv "$CRAFT_PART_INSTALL/opt/top14-live/top14-desktop" \
           "$CRAFT_PART_INSTALL/opt/top14-live/top14-live"
      fi

      # Desktop entry
      mkdir -p "$CRAFT_PART_INSTALL/usr/share/applications"
      printf '%s\n' \
        '[Desktop Entry]' \
        'Name=Top 14 Live' \
        'Comment=Top 14 rugby live score tracker' \
        'Exec=top14-live' \
        'Icon=top14-live' \
        'Terminal=false' \
        'Type=Application' \
        'Categories=Sports;' \
        'StartupNotify=true' \
        > "$CRAFT_PART_INSTALL/usr/share/applications/top14-live.desktop"

      # Icon (hicolor theme so the desktop environment resolves it by name)
      mkdir -p "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/256x256/apps"
      cp assets/icon.png "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/256x256/apps/top14-live.png"

      # Launcher wrapper: clears stale GIO module cache (libgiolibproxy/libpxbackend
      # noise) and passes Electron flags to suppress D-Bus enumeration errors.
      mkdir -p "$CRAFT_PART_INSTALL/bin"
      {
        echo '#!/bin/bash'
        echo '# Clear GIO module cache compiled against system libs absent in the snap.'
        echo 'rm -rf "${XDG_CACHE_HOME:-$HOME/.cache}/gio-modules" 2>/dev/null || true'
        printf 'export YOUTUBE_API_KEY=%s\n' "${YOUTUBE_API_KEY:-}"
        echo 'exec "$SNAP/opt/top14-live/top14-live" \'
        echo '  --no-sandbox \'
        echo '  --disable-features=GlobalMediaControls \'
        echo '  "$@"'
      } > "$CRAFT_PART_INSTALL/bin/top14-live"
      chmod +x "$CRAFT_PART_INSTALL/bin/top14-live"

    stage-packages:
      - libnss3
      - libxss1
      - libxtst6
      - libgbm1
      - libdrm2
      - libxcb-dri3-0
      - xdg-utils
